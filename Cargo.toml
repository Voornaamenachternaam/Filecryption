[package]
name = "filecryption"
version = "0.9.32"
edition = "2024"
rust-version = "1.95.0"
description = "High-security file encryption using Argon2id and XChaCha20-Poly1305"
repository = "https://github.com/Voornaamenachternaam/filecryption"
homepage = "https://github.com/Voornaamenachternaam/filecryption"
license-file = "LICENSE.txt"
keywords = ["encryption", "decryption", "XChaCha20Poly1305"]
categories = ["cryptography"]
publish = false

[dependencies]
orion = { version = "^0.17.15", features = ["default"] }
argon2 = { version = "^0.5.3", default-features = false, features = ["std"] }
base64 = "^0.22.1"
rpassword = "^7.5.4"
clap = { version = "^4.6.2", features = ["derive"] }
zeroize = { version = "^1.9.0", features = ["zeroize_derive"] }
rand = "^0.10.2"
windows-sys = { version = "^0.61.2", optional = true }
getrandom = "^0.4.3"

[features]
windows-replace = ["windows-sys"]

[profile.release]
opt-level = 3
lto = true
strip = true
codegen-units = 1
